services:
  db:
    image: paradedb/paradedb:0.26.0-pg17
    environment:
      POSTGRES_USER: pokedex
      POSTGRES_PASSWORD: pokedex
      POSTGRES_DB: pokedex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: --model-id sentence-transformers/all-MiniLM-L6-v2
    ports:
      - "8080:80"
    volumes:
      - models:/data

volumes:
  pgdata:
  models:
